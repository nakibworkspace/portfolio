<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the site look good on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Description shown in Google search results -->
    <meta name="description" content="Nakib Ahmed Raj — Data/MLOps Engineer & PhD Aspirant." />
    <title>Nakib Ahmed Raj — MLOps Engineer & PhD Aspirant</title>
    <!-- Favicon — edit public/favicon.svg to change the icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Theme bootstrap: apply .dark to <html> BEFORE first paint
         to avoid a flash of wrong theme on refresh. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = stored || system;
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- React renders everything inside this div -->
    <div id="root"></div>
    <!-- main.jsx is the JavaScript entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
