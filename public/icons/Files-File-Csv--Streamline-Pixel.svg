<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" id="Files-File-Csv--Streamline-Pixel" height="32" width="32">
  <desc>
  CSV / file pixel icon (hand-authored to match Streamline Pixel style): document with folded corner and "CSV" badge row.
  </desc>
  <title>files-file-csv</title>
